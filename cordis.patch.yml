- insert:
    - id: read-image-compress
      name: 'dsh-read-image-compress'
      config:
        enabled: true
        compressResolution: true
        compressBitrate: true
        quality: 85
        resolutionScale: 1
        format: auto
        maxEdge: 1568
        maxPixels: 1690000
        maxBytes: 524288
        minBytes: 131072
        minResizeScale: 0.9
        webpEffort: 4
        jpegBackground: '#ffffff'
        cacheEntries: 64
        downscaleWebp: true
        skipGif: true
        summaryMode: detailed
        summaryLanguage: zh
